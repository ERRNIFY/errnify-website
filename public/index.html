<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Errnify</title>
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=tr/" />
    <script>
      // Tarayıcı dili İngilizce ise /en, değilse /tr
      var lang = (navigator.language || "").toLowerCase().indexOf("tr") === 0 ? "tr" : (navigator.language || "").toLowerCase().indexOf("en") === 0 ? "en" : "tr";
      location.replace(lang + "/");
    </script>
  </head>
  <body style="background:#07070a;color:#fff;font-family:system-ui,sans-serif">
    <p><a href="tr/" style="color:#7cf7ff">Errnify</a></p>
  </body>
</html>
